spring:
  application:
    name: core-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/blps}
    username: ${DATABASE_USERNAME:blps}
    password: ${DATABASE_PASSWORD:blps}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: false
      open-in-view: false
      properties:
        hibernate:
          jdbc:
            lob:
              non_contextual_creation: true
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: core-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
app:
  kafka:
    payment-topic: ${PAYMENT_REQUESTS_TOPIC:payment-requests}
    payment-url-assigned-topic: ${PAYMENT_URL_ASSIGNED_TOPIC:payment-url-assigned}
  outbox:
    fixed-delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:2000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
    initial-retry-delay-ms: ${OUTBOX_INITIAL_RETRY_DELAY_MS:5000}
    max-retry-delay-ms: ${OUTBOX_MAX_RETRY_DELAY_MS:300000}
  payment-reminders:
    fixed-delay-ms: ${PAYMENT_REMINDER_SCHEDULER_DELAY_MS:30000}
    payment-url-assigned-topic: ${PAYMENT_URL_ASSIGNED_TOPIC:payment-url-assigned}
  erp-sync-outbox:
    fixed-delay-ms: ${ERP_SYNC_OUTBOX_DELAY_MS:30000}
    batch-size: ${ERP_SYNC_OUTBOX_BATCH_SIZE:20}
    max-attempts: ${ERP_SYNC_OUTBOX_MAX_ATTEMPTS:20}
  camunda:
    base-url: ${CAMUNDA_BASE_URL:http://localhost:8080/engine-rest}
    deploy-on-startup: ${CAMUNDA_DEPLOY_ON_STARTUP:true}
    worker-id: ${CAMUNDA_WORKER_ID:core-service}
    extra-service:
      guest-decision-timeout: ${CAMUNDA_EXTRA_SERVICE_GUEST_DECISION_TIMEOUT:PT24H}
    external-task:
      fixed-delay-ms: ${CAMUNDA_EXTERNAL_TASK_DELAY_MS:3000}
      max-tasks: ${CAMUNDA_EXTERNAL_TASK_MAX_TASKS:10}
      lock-duration-ms: ${CAMUNDA_EXTERNAL_TASK_LOCK_DURATION_MS:30000}
      failure-retries: ${CAMUNDA_EXTERNAL_TASK_FAILURE_RETRIES:3}
      failure-retry-timeout-ms: ${CAMUNDA_EXTERNAL_TASK_FAILURE_RETRY_TIMEOUT_MS:30000}
erpnext:
  company: ${ERPNEXT_COMPANY:AirBNB}
  service-item-code: ${ERPNEXT_SERVICE_ITEM_CODE:EXTRA_SERVICE}
  jndi-name: ${ERPNEXT_JNDI_NAME:java:/eis/ErpNextCF}
server:
  port: 8433
